.dotnet_cache: &dotnet_cache
  cache:
    key: "nuget-$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/packages/
    policy: pull-push
  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

stages:
  - validate
  - verify

site_validate:
  stage: validate
  image: alpine:3.20
  script:
    - sh scripts/validate-site.sh

secret_scan:
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks dir --redact --verbose --exit-code 1 .

php_validate:
  stage: validate
  image: php:8.2-cli
  script:
    - echo "Checking PHP syntax..."
    - |
      files="$(find sabzroyanuraman-site -type f -name '*.php')"
      if [ -z "$files" ]; then
        echo "No PHP files found."
        exit 0
      fi
      for file in $files; do
        echo "Checking $file"
        php -l "$file"
      done

dotnet_verify:
  <<: *dotnet_cache
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet --info
    - dotnet restore BrokeragePlatform.slnx
    - dotnet build BrokeragePlatform.slnx --configuration Release --no-restore
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet tool install --global dotnet-ef --version 10.0.12
    - sh scripts/verify-ef-migrations.sh
    - dotnet test BrokeragePlatform.slnx --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
