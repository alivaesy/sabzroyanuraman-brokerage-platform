stages:
  - validate
  - build
  - test

site_validate:
  stage: validate
  image: alpine:3.20
  script:
    - echo "Validating Sabz Royan Uraman website..."
    - test -f sabzroyanuraman-site/index.html
    - test -f sabzroyanuraman-site/determination-form.html
    - test -f sabzroyanuraman-site/brokerage-details.html
    - test -f sabzroyanuraman-site/web-gis.html
    - test -f sabzroyanuraman-site/web-cad.html
    - test -f sabzroyanuraman-site/.htaccess
    - echo "Required website files are present."

php_validate:
  stage: validate
  image: php:8.2-cli
  pull_policy:
    - always
    - if-not-present
  script:
    - echo "Checking PHP syntax..."
    - |
      files="$(find sabzroyanuraman-site -type f -name '*.php')"
      if [ -z "$files" ]; then
        echo "No PHP files found."
        exit 0
      fi
      for file in $files; do
        echo "Checking $file"
        php -l "$file"
      done

dotnet_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet --info
    - dotnet restore BrokeragePlatform.slnx
    - dotnet build BrokeragePlatform.slnx --configuration Release --no-restore

dotnet_migration_verify:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet tool install --global dotnet-ef --version 10.0.12
    - dotnet restore BrokeragePlatform.slnx
    - dotnet build src/Brokerage.Api/Brokerage.Api.csproj --configuration Release --no-restore
    - |
      set -eu
      migrations="$(dotnet ef migrations list --project src/Brokerage.Infrastructure/Brokerage.Infrastructure.csproj --startup-project src/Brokerage.Api/Brokerage.Api.csproj --configuration Release --no-build)"
      printf '%s\n' "$migrations"
      for migration in \
        "20261005043933_InitialCreate" \
        "20261005093520_AddAuditEvents" \
        "20261005190000_HardenAuditEvents" \
        "20261006100000_PersistOtpMfaState"; do
        if ! printf '%s\n' "$migrations" | grep -Fq "$migration"; then
          echo "ERROR: EF migration '$migration' was not discovered."
          exit 1
        fi
      done
      if printf '%s\n' "$migrations" | grep -Fq "No migrations were found"; then
        echo "ERROR: EF reported that no migrations were found."
        exit 1
      fi

dotnet_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore BrokeragePlatform.slnx
    - dotnet test BrokeragePlatform.slnx --configuration Release --no-restore --logger "console;verbosity=normal"
