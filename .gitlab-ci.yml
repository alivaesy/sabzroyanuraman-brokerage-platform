stages:
  - validate
  - build
  - test

site_validate:
  stage: validate
  image: alpine:3.20
  script:
    - echo "Validating Sabz Royan Uraman website..."
    - test -f sabzroyanuraman-site/index.html
    - test -f sabzroyanuraman-site/determination-form.html
    - test -f sabzroyanuraman-site/brokerage-details.html
    - test -f sabzroyanuraman-site/web-gis.html
    - test -f sabzroyanuraman-site/web-cad.html
    - test -f sabzroyanuraman-site/.htaccess
    - echo "Required website files are present."

php_validate:
  stage: validate
  image: php:8.2-cli
  script:
    - echo "Checking PHP syntax..."
    - |
      files="$(find sabzroyanuraman-site -type f -name '*.php')"
      if [ -z "$files" ]; then
        echo "No PHP files found."
        exit 0
      fi
      for file in $files; do
        echo "Checking $file"
        php -l "$file"
      done

dotnet_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet --info
    - dotnet restore BrokeragePlatform.slnx
    - dotnet build BrokeragePlatform.slnx --configuration Release --no-restore

dotnet_migration_generate:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet tool install --global dotnet-ef --version 10.0.11
    - dotnet restore BrokeragePlatform.slnx
    - dotnet build src/Brokerage.Api/Brokerage.Api.csproj --configuration Release --no-restore
    - rm -rf src/Brokerage.Infrastructure/Persistence/Migrations
    - dotnet ef migrations add InitialCreate --project src/Brokerage.Infrastructure/Brokerage.Infrastructure.csproj --startup-project src/Brokerage.Api/Brokerage.Api.csproj --output-dir Persistence/Migrations --configuration Release --no-build
    - git config user.name "GitLab Migration Bot"
    - git config user.email "gitlab-migration-bot@users.noreply.gitlab.com"
    - git add src/Brokerage.Infrastructure/Persistence/Migrations
    - |
      if git diff --cached --quiet; then
        echo "No migration changes detected."
        exit 0
      fi
      git commit -m "Add EF Core initial migration [skip ci]"
      git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"

dotnet_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore BrokeragePlatform.slnx
    - dotnet test BrokeragePlatform.slnx --configuration Release --no-restore --logger "console;verbosity=normal"
