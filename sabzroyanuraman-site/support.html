<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تیکت پشتیبانی | سبز رویان اورامان</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("/assets/fonts/Vazirmatn-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url("/assets/fonts/Vazirmatn-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box;font-family:"Vazirmatn",sans-serif!important}
body{margin:0;background:#f7fbfd;color:#0d3158}
.support-page-header{background:#fff;border-bottom:1px solid #d7e2e8;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}
.support-page-title{color:#07573e;font-size:20px;font-weight:800}
.support-page-back{display:inline-flex;align-items:center;justify-content:center;padding:9px 18px;border:1px solid #c9d9e2;border-radius:20px;background:#fff;color:#07573e;text-decoration:none;font-size:12px;font-weight:700}
.support-page-main{width:min(1100px,92%);margin:28px auto}
</style>
</head>
<body>
<header class="support-page-header">
<div class="support-page-title">تیکت پشتیبانی</div>
<a class="support-page-back" href="index.html">بازگشت به سایت</a>
</header>
<main class="support-page-main">
        <section class="section main-content-section" id="supportTicket">
            <style>
                .support-ticket-box{
                    background:#fff;
                    border:1px solid #c9d9e2;
                    border-radius:18px;
                    padding:24px;
                    box-shadow:0 8px 28px rgba(20,60,90,.08);
                    direction:rtl;
                }
                .support-ticket-head{
                    display:flex;
                    align-items:center;
                    justify-content:space-between;
                    gap:16px;
                    flex-wrap:wrap;
                    margin-bottom:18px;
                }
                .support-ticket-title{
                    color:#07396c;
                    font-size:22px;
                    font-weight:800;
                }
                .support-ticket-subtitle{
                    color:#667b89;
                    font-size:13px;
                    margin-top:6px;
                }
                .support-ticket-tabs{
                    display:flex;
                    gap:8px;
                    flex-wrap:wrap;
                }
                .support-ticket-tab{
                    border:1px solid #b7cbd7;
                    background:#f6fafc;
                    color:#16435f;
                    border-radius:10px;
                    padding:9px 14px;
                    cursor:pointer;
                    font-family:inherit;
                }
                .support-ticket-tab.active{
                    background:#0f5132;
                    color:#fff;
                    border-color:#0f5132;
                }
                .support-ticket-panel{display:none}
                .support-ticket-panel.active{display:block}
                .support-ticket-grid{
                    display:grid;
                    grid-template-columns:repeat(2,minmax(0,1fr));
                    gap:12px;
                }
                .support-ticket-field{display:flex;flex-direction:column;gap:6px}
                .support-ticket-field.full{grid-column:1/-1}
                .support-ticket-field label{font-size:13px;font-weight:700;color:#29485b}
                .support-ticket-field input,
                .support-ticket-field select,
                .support-ticket-field textarea{
                    width:100%;
                    box-sizing:border-box;
                    border:1px solid #bfd0da;
                    border-radius:10px;
                    padding:11px 12px;
                    background:#fff;
                    color:#17384d;
                    font:inherit;
                    outline:none;
                }
                .support-ticket-field textarea{min-height:130px;resize:vertical}
                .support-ticket-field input:focus,
                .support-ticket-field select:focus,
                .support-ticket-field textarea:focus{
                    border-color:#0f5132;
                    box-shadow:0 0 0 3px rgba(15,81,50,.09);
                }
                .support-ticket-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px}
                .support-ticket-button{
                    border:0;
                    border-radius:10px;
                    padding:11px 18px;
                    background:#0f5132;
                    color:#fff;
                    cursor:pointer;
                    font:inherit;
                    font-weight:700;
                }
                .support-ticket-button.secondary{background:#eef4f7;color:#16435f;border:1px solid #c5d5de}
                .support-ticket-message{
                    margin-top:14px;
                    padding:12px 14px;
                    border-radius:10px;
                    display:none;
                    font-size:13px;
                    line-height:1.8;
                }
                .support-ticket-message.ok{display:block;background:#edf8f1;color:#14532d;border:1px solid #b9dec5}
                .support-ticket-message.error{display:block;background:#fff3f3;color:#8b1e1e;border:1px solid #e7b9b9}
                .support-ticket-result{
                    margin-top:16px;
                    padding:16px;
                    border:1px solid #c8d9e1;
                    border-radius:12px;
                    background:#f9fcfd;
                }
                .support-ticket-number{
                    display:inline-block;
                    direction:ltr;
                    font-weight:800;
                    color:#0f5132;
                    letter-spacing:.5px;
                }
                .support-ticket-meta{
                    display:grid;
                    grid-template-columns:repeat(3,minmax(0,1fr));
                    gap:10px;
                    margin:12px 0;
                }
                .support-ticket-meta div{
                    background:#fff;
                    border:1px solid #d8e3e8;
                    border-radius:9px;
                    padding:9px;
                }
                .support-ticket-meta small{display:block;color:#738693;margin-bottom:3px}
                .support-ticket-thread{
                    display:flex;
                    flex-direction:column;
                    gap:8px;
                    margin-top:12px;
                }
                .support-ticket-message-row{
                    border:1px solid #d8e3e8;
                    background:#fff;
                    border-radius:10px;
                    padding:11px 13px;
                }
                .support-ticket-message-row .author{font-weight:700;color:#16435f;font-size:12px}
                .support-ticket-message-row .date{font-size:11px;color:#81929d;margin-right:8px}
                .support-ticket-message-row .body{white-space:pre-wrap;line-height:1.8;margin-top:6px}
                @media(max-width:720px){
                    .support-ticket-grid,.support-ticket-meta{grid-template-columns:1fr}
                    .support-ticket-field.full{grid-column:auto}
                    .support-ticket-box{padding:16px}
                }
            </style>

            <div class="support-ticket-box">
                <div class="support-ticket-head">
                    <div>
                        <div class="support-ticket-title">تیکت پشتیبانی</div>
                        <div class="support-ticket-subtitle">درخواست خود را ثبت کنید و با شماره تیکت و کد دسترسی، وضعیت و پاسخ‌ها را پیگیری کنید.</div>
                    </div>
                    <div class="support-ticket-tabs">
                        <button type="button" class="support-ticket-tab active" data-ticket-tab="create">ثبت تیکت جدید</button>
                        <button type="button" class="support-ticket-tab" data-ticket-tab="track">پیگیری تیکت</button>
                    </div>
                </div>

                <div class="support-ticket-panel active" data-ticket-panel="create">
                    <form id="supportTicketCreateForm">
                        <div class="support-ticket-grid">
                            <div class="support-ticket-field">
                                <label for="supportTicketName">نام و نام خانوادگی *</label>
                                <input id="supportTicketName" name="name" maxlength="120" required>
                            </div>
                            <div class="support-ticket-field">
                                <label for="supportTicketPhone">شماره موبایل *</label>
                                <input id="supportTicketPhone" name="phone" inputmode="tel" maxlength="30" required>
                            </div>
                            <div class="support-ticket-field">
                                <label for="supportTicketEmail">ایمیل</label>
                                <input id="supportTicketEmail" name="email" type="email" maxlength="190">
                            </div>
                            <div class="support-ticket-field">
                                <label for="supportTicketCategory">موضوع</label>
                                <select id="supportTicketCategory" name="category">
                                    <option value="عمومی">عمومی</option>
                                    <option value="نقشه و GIS">نقشه و GIS</option>
                                    <option value="امور اراضی و کاداستر">امور اراضی و کاداستر</option>
                                    <option value="پرداخت و سفارش">پرداخت و سفارش</option>
                                    <option value="فنی و سایت">فنی و سایت</option>
                                </select>
                            </div>
                            <div class="support-ticket-field full">
                                <label for="supportTicketSubject">عنوان درخواست *</label>
                                <input id="supportTicketSubject" name="subject" maxlength="180" required>
                            </div>
                            <div class="support-ticket-field full">
                                <label for="supportTicketBody">شرح درخواست *</label>
                                <textarea id="supportTicketBody" name="message" maxlength="5000" required></textarea>
                            </div>
                        </div>
                        <div class="support-ticket-actions">
                            <button class="support-ticket-button" type="submit" id="supportTicketCreateButton">ثبت تیکت</button>
                            <span style="font-size:12px;color:#6d7f8b">پس از ثبت، شماره تیکت و کد دسترسی نمایش داده می‌شود؛ کد دسترسی را نگه دارید.</span>
                        </div>
                    </form>
                    <div id="supportTicketCreateMessage" class="support-ticket-message"></div>
                    <div id="supportTicketCreatedResult" class="support-ticket-result" style="display:none"></div>
                </div>

                <div class="support-ticket-panel" data-ticket-panel="track">
                    <form id="supportTicketTrackForm">
                        <div class="support-ticket-grid">
                            <div class="support-ticket-field">
                                <label for="supportTicketNumber">شماره تیکت *</label>
                                <input id="supportTicketNumber" placeholder="مثلاً SR-20260927-AB12CD" maxlength="40" required dir="ltr">
                            </div>
                            <div class="support-ticket-field">
                                <label for="supportTicketToken">کد دسترسی *</label>
                                <input id="supportTicketToken" maxlength="80" required dir="ltr">
                            </div>
                        </div>
                        <div class="support-ticket-actions">
                            <button class="support-ticket-button" type="submit" id="supportTicketTrackButton">نمایش تیکت</button>
                        </div>
                    </form>
                    <div id="supportTicketTrackMessage" class="support-ticket-message"></div>
                    <div id="supportTicketTrackResult" class="support-ticket-result" style="display:none"></div>
                </div>
            </div>

            <script>
            (function(){
                const api = "/api/tickets.php";
                const tabs = document.querySelectorAll("[data-ticket-tab]");
                const panels = document.querySelectorAll("[data-ticket-panel]");

                function showTab(name){
                    tabs.forEach(t => t.classList.toggle("active", t.dataset.ticketTab === name));
                    panels.forEach(p => p.classList.toggle("active", p.dataset.ticketPanel === name));
                    if(name === "track") loadSavedTicket();
                }

                tabs.forEach(t => t.addEventListener("click", () => showTab(t.dataset.ticketTab)));

                function message(el, text, ok){
                    el.textContent = text || "";
                    el.className = "support-ticket-message " + (ok ? "ok" : "error");
                }

                function escapeHtml(value){
                    return String(value ?? "").replace(/[&<>"']/g, ch => ({
                        "&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"
                    }[ch]));
                }

                function faStatus(value){
                    const map = {open:"باز",answered:"پاسخ داده شده",pending_customer:"منتظر پاسخ شما",closed:"بسته شده"};
                    return map[value] || value || "نامشخص";
                }

                function formatDate(value){
                    try { return new Date(value).toLocaleString("fa-IR"); } catch(e){ return value || ""; }
                }

                function renderTicket(data, target, allowReply){
                    const messages = Array.isArray(data.messages) ? data.messages : [];
                    target.innerHTML =
                        '<div><strong>شماره تیکت:</strong> <span class="support-ticket-number">'+escapeHtml(data.ticket_number)+'</span></div>'+
                        '<div class="support-ticket-meta">'+
                            '<div><small>وضعیت</small><strong>'+escapeHtml(faStatus(data.status))+'</strong></div>'+
                            '<div><small>موضوع</small><strong>'+escapeHtml(data.subject)+'</strong></div>'+
                            '<div><small>آخرین بروزرسانی</small><strong>'+escapeHtml(formatDate(data.updated_at))+'</strong></div>'+
                        '</div>'+
                        '<div><strong>گفتگو</strong></div>'+
                        '<div class="support-ticket-thread">'+
                            (messages.length ? messages.map(m =>
                                '<div class="support-ticket-message-row">'+
                                    '<span class="author">'+escapeHtml(m.author_type === "staff" ? "پشتیبانی" : "شما")+'</span>'+
                                    '<span class="date">'+escapeHtml(formatDate(m.created_at))+'</span>'+
                                    '<div class="body">'+escapeHtml(m.body)+'</div>'+
                                '</div>'
                            ).join("") : '<div class="support-ticket-message-row">هنوز پاسخی ثبت نشده است.</div>')+
                        '</div>'+
                        (allowReply && data.status !== "closed" ?
                            '<form id="supportTicketReplyForm" style="margin-top:14px">'+
                                '<div class="support-ticket-field"><label for="supportTicketReply">پیام جدید</label><textarea id="supportTicketReply" maxlength="5000" required></textarea></div>'+
                                '<div class="support-ticket-actions"><button class="support-ticket-button" type="submit">ارسال پیام</button></div>'+
                            '</form>' : "");

                    const replyForm = document.getElementById("supportTicketReplyForm");
                    if(replyForm){
                        replyForm.addEventListener("submit", async function(ev){
                            ev.preventDefault();
                            const body = document.getElementById("supportTicketReply").value.trim();
                            const number = document.getElementById("supportTicketNumber").value.trim();
                            const token = document.getElementById("supportTicketToken").value.trim();
                            if(!body) return;
                            const button = replyForm.querySelector("button");
                            button.disabled = true;
                            try{
                                const res = await fetch(api,{
                                    method:"POST",
                                    headers:{"Content-Type":"application/json","Accept":"application/json"},
                                    body:JSON.stringify({action:"reply",ticket_number:number,access_token:token,message:body})
                                });
                                const json = await res.json();
                                if(!res.ok || !json.ok) throw new Error(json.error || "ارسال پیام ناموفق بود.");
                                renderTicket(json.ticket, target, true);
                            }catch(err){
                                const box=document.getElementById("supportTicketTrackMessage");
                                message(box,err.message,false);
                            }finally{
                                button.disabled=false;
                            }
                        });
                    }
                }

                async function loadTicket(number, token){
                    const box=document.getElementById("supportTicketTrackMessage");
                    const target=document.getElementById("supportTicketTrackResult");
                    target.style.display="block";
                    target.textContent="در حال دریافت اطلاعات تیکت...";
                    message(box,"",true);
                    const res=await fetch(api,{
                        method:"POST",
                        headers:{"Content-Type":"application/json","Accept":"application/json"},
                        body:JSON.stringify({action:"get",ticket_number:number,access_token:token})
                    });
                    const json=await res.json();
                    if(!res.ok || !json.ok) throw new Error(json.error || "تیکت پیدا نشد.");
                    renderTicket(json.ticket,target,true);
                    localStorage.setItem("sr_ticket_number",number);
                    localStorage.setItem("sr_ticket_token",token);
                }

                function loadSavedTicket(){
                    const number=localStorage.getItem("sr_ticket_number");
                    const token=localStorage.getItem("sr_ticket_token");
                    if(number && token){
                        document.getElementById("supportTicketNumber").value=number;
                        document.getElementById("supportTicketToken").value=token;
                    }
                }

                document.getElementById("supportTicketCreateForm").addEventListener("submit", async function(ev){
                    ev.preventDefault();
                    const form=ev.currentTarget;
                    const button=document.getElementById("supportTicketCreateButton");
                    const box=document.getElementById("supportTicketCreateMessage");
                    const result=document.getElementById("supportTicketCreatedResult");
                    const data=Object.fromEntries(new FormData(form).entries());
                    data.action="create";
                    button.disabled=true;
                    result.style.display="none";
                    message(box,"در حال ثبت تیکت...",true);
                    try{
                        const res=await fetch(api,{
                            method:"POST",
                            headers:{"Content-Type":"application/json","Accept":"application/json"},
                            body:JSON.stringify(data)
                        });
                        const json=await res.json();
                        if(!res.ok || !json.ok) throw new Error(json.error || "ثبت تیکت ناموفق بود.");
                        localStorage.setItem("sr_ticket_number",json.ticket_number);
                        localStorage.setItem("sr_ticket_token",json.access_token);
                        result.style.display="block";
                        result.innerHTML=
                            '<strong>تیکت با موفقیت ثبت شد.</strong><br>'+
                            'شماره تیکت: <span class="support-ticket-number">'+escapeHtml(json.ticket_number)+'</span><br>'+
                            'کد دسترسی: <span dir="ltr" class="support-ticket-number">'+escapeHtml(json.access_token)+'</span><br>'+
                            '<small>این دو مقدار را برای پیگیری نگه دارید. کد دسترسی فقط هنگام ثبت تیکت نمایش داده می‌شود.</small>';
                        message(box,"تیکت شما ثبت و در سامانه ذخیره شد.",true);
                        form.reset();
                    }catch(err){
                        message(box,err.message,false);
                    }finally{
                        button.disabled=false;
                    }
                });

                document.getElementById("supportTicketTrackForm").addEventListener("submit", async function(ev){
                    ev.preventDefault();
                    const number=document.getElementById("supportTicketNumber").value.trim();
                    const token=document.getElementById("supportTicketToken").value.trim();
                    const button=document.getElementById("supportTicketTrackButton");
                    const box=document.getElementById("supportTicketTrackMessage");
                    button.disabled=true;
                    try{
                        await loadTicket(number,token);
                        message(box,"تیکت با موفقیت دریافت شد.",true);
                    }catch(err){
                        document.getElementById("supportTicketTrackResult").style.display="none";
                        message(box,err.message,false);
                    }finally{
                        button.disabled=false;
                    }
                });

                loadSavedTicket();
            })();
            </script>
        </section>
</main>
</body>
</html>
