[package]
name = "sabz-royan-vector-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

# Use RustGIS's actual analysis and data crates, pinned to one immutable upstream revision.
# The UI remains in the Sabz Royan JavaScript application; the processing algorithms execute here.
rustgis-analysis = { git = "https://github.com/opengeos/RustGIS.git", rev = "38f24336140d59092a31f964e9ac86aab18fdecd", default-features = false }
rustgis-data = { git = "https://github.com/opengeos/RustGIS.git", rev = "38f24336140d59092a31f964e9ac86aab18fdecd", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
