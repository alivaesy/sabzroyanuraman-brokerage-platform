name: RustGIS vector geoprocessing WASM

on:
  pull_request:
    paths:
      - "sabzroyanuraman-site/web-gis.html"
      - "sabzroyanuraman-site/webgis-rustgis-vector-runtime.js"
      - "sabzroyanuraman-site/rustgis-vector-wasm/**"
      - "tests/web-gis-static.test.cjs"
      - ".github/workflows/rustgis-vector-wasm.yml"
  push:
    branches: [master]
    paths:
      - "sabzroyanuraman-site/web-gis.html"
      - "sabzroyanuraman-site/webgis-rustgis-vector-runtime.js"
      - "sabzroyanuraman-site/rustgis-vector-wasm/**"
      - ".github/workflows/rustgis-vector-wasm.yml"

permissions:
  contents: read

jobs:
  vector-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack without cross-device rename
        run: cargo install wasm-pack --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Native RustGIS vector tests
        working-directory: sabzroyanuraman-site/rustgis-vector-wasm
        run: cargo test
      - name: WebGIS runtime and toolbox regression tests
        run: node --test tests/web-gis-static.test.cjs
      - name: Build browser WASM package
        working-directory: sabzroyanuraman-site/rustgis-vector-wasm
        run: wasm-pack build --target web --release --out-dir ../rustgis-vector-wasm-pkg --out-name sabz_royan_vector_wasm
      - name: Check vector runtime syntax
        run: node --check sabzroyanuraman-site/webgis-rustgis-vector-runtime.js
      - name: Upload WASM package for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sabz-royan-rustgis-vector-wasm
          path: sabzroyanuraman-site/rustgis-vector-wasm-pkg/
          if-no-files-found: error
          retention-days: 14
