name: Web GIS checks

on:
  push:
    branches:
      - "master"
      - "feat/rustgis-vector-geoprocessing-phase-3"
      - "feat/webgis-rustgis-unified-package"
    paths:
      - "sabzroyanuraman-site/web-gis.html"
      - "sabzroyanuraman-site/webgis-rustgis-enhancements.js"
      - "sabzroyanuraman-site/webgis-rustgis-vector-runtime.js"
      - "tests/web-gis-static.test.cjs"
      - "tests/web-gis-browser-regression.cjs"
      - "tests/web-gis-arcmap-import-regression.cjs"
      - "sabzroyanuraman-site/webgis-arcmap-manifest.js"
      - "sabzroyanuraman-site/webgis-gdb-catalog.js"
      - "sabzroyanuraman-site/rustgis-vector-wasm/**"
      - "tests/fixtures/**"
      - "tools/mxd_to_manifest.py"
      - ".github/workflows/web-gis-check.yml"
  pull_request:
    paths:
      - "sabzroyanuraman-site/web-gis.html"
      - "sabzroyanuraman-site/webgis-rustgis-enhancements.js"
      - "sabzroyanuraman-site/webgis-rustgis-vector-runtime.js"
      - "tests/web-gis-static.test.cjs"
      - "tests/web-gis-browser-regression.cjs"
      - ".github/workflows/web-gis-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Web GIS source and toolbox registration
        run: |
          node --test tests/web-gis-static.test.cjs
          python -m py_compile tools/mxd_to_manifest.py
      - name: Check ModelBuilder, Layout, and RustGIS runtime syntax
        run: |
          node --check sabzroyanuraman-site/webgis-rustgis-enhancements.js
          node --check sabzroyanuraman-site/webgis-rustgis-vector-runtime.js
          node --check sabzroyanuraman-site/webgis-arcmap-manifest.js
          node --check sabzroyanuraman-site/webgis-gdb-catalog.js


  browser-regression:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run projected geo Clip unit test
        working-directory: sabzroyanuraman-site/rustgis-vector-wasm
        run: cargo test --lib projected_clip_uses_geo_boolean_ops_in_utm
      - name: Build RustGIS WASM from this commit
        working-directory: sabzroyanuraman-site/rustgis-vector-wasm
        run: wasm-pack build --target web --release --out-dir ../rustgis-vector-wasm-pkg --out-name sabz_royan_vector_wasm
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare real FileGDB browser fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip
          mkdir -p /tmp/gdb-fixture
          7z x -y -o/tmp/gdb-fixture "sabzroyanuraman-site/New File Geodatabase.gdb.rar"
          (cd /tmp/gdb-fixture && zip -qr "$GITHUB_WORKSPACE/tests/fixtures/sample-gdb.zip" "New File Geodatabase.gdb")
      - name: Serve the checked-out WebGIS source
        run: |
          python3 -m http.server 4173 --directory sabzroyanuraman-site >/tmp/webgis-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/web-gis.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/webgis-http.log
          exit 1
      - name: Run ArcMap manifest and Repair Data Source browser regression
        env:
          WEBGIS_BASE_URL: http://127.0.0.1:4173/web-gis.html
        run: node tests/web-gis-arcmap-import-regression.cjs
      - name: Run existing WebGIS browser regression
        env:
          WEBGIS_BASE_URL: http://127.0.0.1:4173/web-gis.html
        run: node tests/web-gis-browser-regression.cjs
