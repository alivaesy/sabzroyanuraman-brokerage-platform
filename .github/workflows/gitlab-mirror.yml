name: Mirror GitHub to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# Serialize mirror runs so simultaneous pushes cannot race at the GitLab destination.
concurrency:
  group: github-to-gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Push all GitHub branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKENNNN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/sabz-group1/sabzroyanuraman-github-mirror.git"
          git push gitlab 'refs/remotes/origin/*:refs/heads/*'
          git push gitlab --tags
