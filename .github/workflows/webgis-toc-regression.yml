name: WebGIS TOC and browser regression
on:
  pull_request:
    paths:
      - "sabzroyanuraman-site/web-gis.html"
      - "sabzroyanuraman-site/js/webgis-toc-enhancements.js"
      - "tests/web-gis-*.test.cjs"
      - "tests/web-gis-browser.spec.cjs"
      - ".github/workflows/webgis-toc-regression.yml"
  push:
    branches:
      - "feat/arcmap-toc-catalog-enhancements"
    paths:
      - "sabzroyanuraman-site/web-gis.html"
      - "sabzroyanuraman-site/js/webgis-toc-enhancements.js"
      - "tests/web-gis-*.test.cjs"
      - "tests/web-gis-browser.spec.cjs"
      - ".github/workflows/webgis-toc-regression.yml"
jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run WebGIS static and TOC regression tests
        run: node --test tests/web-gis-static.test.cjs tests/web-gis-toc-enhancements.test.cjs

  chromium-browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.64.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium browser tests
        run: npx playwright test tests/web-gis-browser.spec.cjs --reporter=line
