name: RustGIS raster WASM adapter
on:
  push:
    branches: [master]
    paths:
      - "rust-raster-wasm/**"
      - "tests/**"
      - "tests/raster-server-cross-browser.e2e.cjs"
      - "sabzroyanuraman-site/raster-runtime.js"
      - "sabzroyanuraman-site/rust-raster-bridge.js"
      - "sabzroyanuraman-site/rustgis-vector-wasm/**"
      - "sabzroyanuraman-site/webgis-rustgis-vector-runtime.js"
      - "sabzroyanuraman-site/wasm/rust-raster/**"
      - "sabzroyanuraman-site/api/gis/raster-assets.php"
      - "sabzroyanuraman-site/api/gis/raster-asset-commit.php"
      - "sabzroyanuraman-site/api/gis/raster-geotiff-validator.php"
      - "sabzroyanuraman-site/web-gis.html"
      - "sabzroyanuraman-site/webgis-symbology-core.js"
      - "sabzroyanuraman-site/webgis-labeling-core.js"
      - "tests/webgis-symbology-core.test.cjs"
      - "tests/webgis-labeling-core.test.cjs"
      - "sabzroyanuraman-site/raster-runtime-tests.html"
      - "docs/WEBGIS_STORAGE_SERVER_ACCESS.md"
      - ".github/workflows/rustgis-raster-wasm.yml"
  pull_request:
    paths:
      - "rust-raster-wasm/**"
      - "sabzroyanuraman-site/**"
      - ".github/workflows/rustgis-raster-wasm.yml"
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack without cross-device rename
        run: cargo install wasm-pack --locked
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint raster storage API and helpers
        run: |
          php -l sabzroyanuraman-site/api/gis/raster-assets.php
          php -l sabzroyanuraman-site/api/gis/raster-asset-commit.php
          php -l sabzroyanuraman-site/api/gis/raster-geotiff-validator.php
      - name: Test GeoTIFF validation and atomic server-storage commit
        run: php tests/raster-geotiff-validator.test.php
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser bridge syntax
        run: |
          node --check sabzroyanuraman-site/rust-raster-bridge.js
          node --check sabzroyanuraman-site/geolibre-wasi-bridge.js
          node --check sabzroyanuraman-site/plugin-manager.js
          node --check tests/raster-wasm-browser-smoke.cjs
          node --check tests/raster-server-cross-browser.e2e.cjs
          node --check sabzroyanuraman-site/webgis-symbology-core.js
          node --check tests/webgis-symbology-core.test.cjs
          node tests/webgis-symbology-core.test.cjs
          node --check sabzroyanuraman-site/webgis-labeling-core.js
          node --check tests/webgis-labeling-core.test.cjs
          node tests/webgis-labeling-core.test.cjs
      - name: Test RustGIS adapter and plugin runtime
        run: cargo test --manifest-path rust-raster-wasm/Cargo.toml
      - name: Build browser WASM
        run: wasm-pack build rust-raster-wasm --target web --out-dir ../sabzroyanuraman-site/wasm/rust-raster --out-name sabz_raster_wasm
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.0
          npx playwright install --with-deps chromium
      - name: Run real RustGIS browser smoke tests
        run: |
          python3 -m http.server 4173 --directory sabzroyanuraman-site >/tmp/sabz-webgis-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/raster-runtime-tests.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/raster-wasm-browser-smoke.cjs
      - name: Verify authenticated raster persistence across isolated browsers
        if: ${{ vars.GIS_RASTER_E2E_ENABLED == 'true' }}
        env:
          SABZ_GIS_E2E_BASE_URL: ${{ vars.GIS_RASTER_E2E_BASE_URL }}
          SABZ_GIS_E2E_ORGANIZATION_ID: ${{ vars.GIS_RASTER_E2E_ORGANIZATION_ID }}
          SABZ_GIS_E2E_PROJECT_ID: ${{ vars.GIS_RASTER_E2E_PROJECT_ID }}
          SABZ_GIS_E2E_USERNAME: ${{ secrets.GIS_RASTER_E2E_USERNAME }}
          SABZ_GIS_E2E_PASSWORD: ${{ secrets.GIS_RASTER_E2E_PASSWORD }}
        run: node tests/raster-server-cross-browser.e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: sabz-rustgis-raster-wasm
          path: sabzroyanuraman-site/wasm/rust-raster/
          if-no-files-found: error
